# Port 80 stays internal, solely for the container health check.
server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream api:8010;
    location = /healthz { access_log off; return 200 "ok\n"; }
    location = /api/ready {
        access_log off;
        proxy_pass http://$api_upstream/ready;
    }
    location / { return 404; }
}

server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/snippets/medknowledge-routes.conf;
}
