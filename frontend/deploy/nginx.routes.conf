client_max_body_size 64m;

# Docker assigns a new address when the API container is recreated. Resolve it
# at request time so a rolling restart does not leave NGINX on a stale IP.
resolver 127.0.0.11 valid=10s ipv6=off;
set $api_upstream api:8010;

add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

# Preserve streaming chunks and allow long model responses. The trailing /api
# path is stripped only for the generic location below.
location = /api/customer-service/completion {
    proxy_pass http://$api_upstream/customer-service/completion;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    # Single trusted hop: overwrite any client-supplied X-Forwarded-For.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    add_header Cache-Control no-store always;
}

location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
}

location / {
    try_files $uri $uri/ /index.html;
}
